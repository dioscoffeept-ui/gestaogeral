<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --brand: #9C3815; --brand-soft: #fbeee8; --ink: #0f172a; --mut: #64748b; --line: #e2e8f0; --bg: #F6F3F0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: 110px; }
  button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  .top { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #f1f5f9; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; }
  .top .in { max-width: 640px; margin: 0 auto; }
  .shop { display: flex; align-items: center; gap: 10px; }
  .logo { width: 38px; height: 38px; border-radius: 12px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; overflow: hidden; flex-shrink: 0; }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .shop b { display: block; font-size: 16px; font-weight: 900; } .shop span { font-size: 12px; color: var(--mut); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; } .tabs::-webkit-scrollbar { display: none; }
  .tab { flex-shrink: 0; padding: 7px 13px; border-radius: 99px; font-size: 13px; font-weight: 800; background: #f1f5f9; color: #475569; white-space: nowrap; }
  .tab.on { background: var(--brand); color: #fff; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 14px 16px; }
  .sec { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .07em; color: var(--mut); margin: 18px 2px 8px; }
  .item { display: flex; gap: 12px; align-items: center; background: #fff; border: 1px solid #f1f5f9; border-radius: 18px; padding: 10px; margin-bottom: 8px; width: 100%; text-align: left; }
  .item .ph { width: 76px; height: 76px; border-radius: 14px; background: var(--brand-soft) center/cover no-repeat; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .item .tx { flex: 1; min-width: 0; } .item .tx b { display: block; font-size: 15px; font-weight: 800; }
  .item .tx p { margin: 2px 0 0; font-size: 12px; color: var(--mut); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .item .pr { font-size: 14px; font-weight: 900; margin-top: 4px; display: block; }
  .item .add { width: 36px; height: 36px; border-radius: 12px; background: var(--brand); color: #fff; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .item .q { min-width: 26px; height: 26px; border-radius: 99px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .bar button { width: 100%; max-width: 608px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-radius: 16px; background: var(--brand); color: #fff; font-size: 16px; font-weight: 900; box-shadow: 0 14px 30px -14px var(--brand); }
  .bar .n { background: rgba(255,255,255,.22); border-radius: 99px; padding: 2px 9px; font-size: 13px; }
  .sheet { position: fixed; inset: 0; z-index: 30; background: rgba(15,23,42,.45); display: none; align-items: flex-end; justify-content: center; }
  .sheet.on { display: flex; }
  .sheet .box { background: #fff; width: 100%; max-width: 640px; border-radius: 24px 24px 0 0; max-height: 92vh; overflow-y: auto; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(30px); opacity: .5; } to { transform: none; opacity: 1; } }
  .sheet h3 { margin: 0 0 4px; font-size: 19px; font-weight: 900; }
  .opt { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 14px; margin-top: 8px; font-size: 14px; font-weight: 700; text-align: left; }
  .opt.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
  .row .nm { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; } .row .nm small { display: block; color: var(--mut); font-weight: 600; }
  .qb { display: flex; align-items: center; gap: 8px; } .qb button { width: 32px; height: 32px; border-radius: 10px; background: #f1f5f9; font-size: 18px; font-weight: 800; } .qb button.p { background: var(--brand); color: #fff; }
  .tot { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 0 4px; } .tot b { font-size: 26px; font-weight: 900; }
  label { display: block; font-size: 11px; font-weight: 800; color: var(--mut); text-transform: uppercase; letter-spacing: .05em; margin: 12px 0 5px; }
  input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; font-size: 16px; font-family: inherit; outline: none; background: #fff; }
  input:focus, textarea:focus { border-color: var(--brand); }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .more summary { list-style: none; cursor: pointer; font-size: 13px; font-weight: 800; color: var(--brand); margin-top: 12px; } .more summary::-webkit-details-marker { display: none; }
  .main { width: 100%; margin-top: 16px; padding: 16px; border-radius: 14px; background: var(--brand); color: #fff; font-size: 17px; font-weight: 900; box-shadow: 0 12px 26px -14px var(--brand); }
  .main:disabled { opacity: .5; }
  .err { color: #b91c1c; font-size: 13px; font-weight: 600; margin-top: 10px; text-align: center; min-height: 1em; }
  .hint { font-size: 11px; color: #94a3b8; margin-top: 4px; }
  .item { position: relative; } .item.esg { opacity: .5; filter: grayscale(1); cursor: not-allowed; }
  .item .tag { position: absolute; top: 8px; left: 8px; background: var(--ink); color: #fff; font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; }
  .item .tag.pouco { background: #d97706; }
  #aviso { position: fixed; left: 50%; top: 16px; transform: translate(-50%, -80px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 14px; font-weight: 700; z-index: 99; transition: transform .2s; pointer-events: none; }
  #aviso.on { transform: translate(-50%, 0); }
  .tips { display: grid; grid-template-columns: 1.35fr 1fr 1fr 1fr 1.15fr; gap: 6px; } .tipc { padding: 10px 4px; border-radius: 12px; border: 1.5px solid var(--line); font-size: 12.5px; font-weight: 800; line-height: 1.15; }
  .tipc.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
  .sec2 { width: 100%; margin-top: 8px; padding: 14px; border-radius: 14px; border: 1.5px solid var(--brand); color: var(--brand); font-size: 15px; font-weight: 900; background: #fff; }
  .sec2:disabled { opacity: .5; }
  .banner { display: none; margin: 0 0 12px; padding: 12px 14px; border-radius: 16px; background: var(--ink); color: #fff; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 700; }
  .banner.on { display: flex; } .banner button { background: #fff; color: var(--ink); padding: 8px 12px; border-radius: 10px; font-weight: 900; font-size: 13px; white-space: nowrap; }
  .empty { text-align: center; color: var(--mut); padding: 50px 16px; font-weight: 600; font-size: 14px; line-height: 1.5; }
  .algb { display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 17px; padding: 0 3px; box-sizing: border-box; margin-left: 5px; border: 1.5px solid currentColor; border-radius: 99px; font-size: 9.5px; font-weight: 800; font-style: normal; color: var(--mut); vertical-align: 2px; line-height: 1; }
  .algleg { font-weight: 600; } .algleg .algb { margin: 0 2px 0 0; vertical-align: 1px; }
  .legal { margin: 26px 2px 110px; padding-top: 14px; border-top: 1px solid #e2e8f0; font-size: 11px; line-height: 1.5; color: #64748b; }
  .legal p { margin: 0 0 6px; } .legal a { color: inherit; font-weight: 700; }
</style>
</head>
<body>
  <header class="top"><div class="in">
    <div class="shop"><div class="logo" id="logo">☕</div><div style="flex:1;min-width:0"><b id="lname">Menu</b><span id="tagl"></span></div><div id="langs" style="display:flex;gap:3px;flex-shrink:0"></div></div>
    <div class="tabs" id="tabs"></div>
  </div></header>
  <main class="wrap">
    <div class="banner" id="banner"><span id="banner-t"></span><button type="button" id="banner-b"></button></div>
    <div id="list"><div class="empty">…</div></div>
  </main>
  <div class="bar" id="bar" hidden><button type="button" onclick="abrirCarrinho()"><span><span class="n" id="bar-n">0</span>&nbsp; <span id="bar-l"></span></span><span id="bar-t">0,00 €</span></button></div>
  <div class="sheet" id="sh-var" onclick="if(event.target===this)fechar('sh-var')"><div class="box" id="var-box"></div></div>
  <div class="sheet" id="sh-cart" onclick="if(event.target===this)fechar('sh-cart')"><div class="box" id="cart-box"></div></div>

  <script src="cli-i18n.js"></script>
  <script src="acompanhar.js"></script>
  <script src="qr.js"></script>
  <script>
    const FN = 'https://brisrzuvvxkkzhmhsgro.supabase.co/functions/v1/pedido-publico';
    const FN_PAG = 'https://brisrzuvvxkkzhmhsgro.supabase.co/functions/v1/pagar-publico';
    const N = new URLSearchParams(location.search).get('n') || '';
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const eur = v => Number(v).toLocaleString(LOCALE, { style: 'currency', currency: 'EUR' });
    let data = null, cart = [], cat = '';
    try { cart = JSON.parse(sessionStorage.getItem('ds_cart_' + N) || '[]') || []; } catch (_) { cart = []; }
    const guardar = () => { try { sessionStorage.setItem('ds_cart_' + N, JSON.stringify(cart)); } catch (_) {} };

    async function post(url, body) {
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.erro || 'Erro ' + r.status);
      return j;
    }
    function nifOk(n) { n = String(n || '').replace(/\D/g, ''); if (!/^\d{9}$/.test(n)) return false; let s = 0; for (let i = 0; i < 8; i++) s += Number(n[i]) * (9 - i); const c = 11 - (s % 11); return (c >= 10 ? 0 : c) === Number(n[8]); }
    function marca() {
      const m = data.marca || {};
      if (m.brand) { document.documentElement.style.setProperty('--brand', m.brand); document.documentElement.style.setProperty('--brand-soft', 'color-mix(in srgb, ' + m.brand + ' 12%, #fff)'); }
      if (m.bg) document.documentElement.style.setProperty('--bg', m.bg);
      document.getElementById('lname').textContent = data.loja || T('menu');
      document.title = T('menu') + ' · ' + (data.loja || '');
      if (m.logo) document.getElementById('logo').innerHTML = '<img src="' + esc(m.logo) + '" alt="">';
    }
    function cats() {
      const ordem = data.cats || [], usadas = [...new Set(data.menu.map(m => m.cat || 'Outros'))];
      return usadas.sort((a, b) => { const ia = ordem.indexOf(a), ib = ordem.indexOf(b); return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib); });
    }
    function qtdDe(id) { return cart.filter(c => c.id === id).reduce((a, c) => a + c.qty, 0); }
    function render() {
      const cs = cats();
      document.getElementById('tabs').innerHTML = ['', ...cs].map(c => `<button type="button" class="tab ${c === cat ? 'on' : ''}" onclick="cat='${esc(c).replace(/'/g, "\\'")}';render();scrollTo({top:0,behavior:'smooth'})">${c ? esc(c === 'Outros' ? T('others') : c) : T('all')}</button>`).join('');
      if (!data.ativo) { document.getElementById('list').innerHTML = '<div class="empty">' + T('notAvail') + '</div>'; barra(); return; }
      if (!data.menu.length) { document.getElementById('list').innerHTML = '<div class="empty">' + T('menuEmpty') + '</div>'; barra(); return; }
      const grupos = (cat ? [cat] : cs);
      document.getElementById('list').innerHTML = grupos.map(g => {
        const its = data.menu.filter(m => (m.cat || 'Outros') === g);
        if (!its.length) return '';
        return `<p class="sec">${esc(g === 'Outros' ? T('others') : g)}</p>` + its.map(m => { const q = qtdDe(m.id), esg = m.restam === 0, pouco = m.restam != null && m.restam > 0 && m.restam <= 3; return `<button type="button" class="item ${esg ? 'esg' : ''}" ${esg ? 'disabled' : ''} onclick="tocar('${m.id}')">
          <span class="ph" style="${m.foto ? `background-image:url('${esc(m.foto)}')` : ''}">${m.foto ? '' : (m.tipo === 'KITCHEN' ? '🍽️' : '☕')}</span>
          <span class="tx"><b>${esc(m.nome)}${(m.alerg || []).map(k => `<i class="algb" title="${T('al_' + k)}">${ALG_L[k] || '?'}</i>`).join('')}</b>${m.desc ? `<p>${esc(m.desc)}</p>` : ''}<span class="pr">${eur(m.preco)}</span></span>
          ${esg ? `<span class="tag">${T('soldOut')}</span>` : q ? `<span class="q">${q}</span>` : '<span class="add">+</span>'}${pouco && !esg ? `<span class="tag pouco">${T('leftN')} ${m.restam}</span>` : ''}</button>`; }).join('');
      }).join('') + legalHtml();
      barra();
    }
    const ALG_L = { gluten: 'G', crustaceos: 'Cr', ovos: 'O', peixe: 'P', amendoim: 'Am', soja: 'So', leite: 'L', frutos: 'F', aipo: 'Ai', mostarda: 'M', sesamo: 'Se', sulfitos: 'Su', tremoco: 'T', moluscos: 'Mo' };
    function legalHtml() {
      const L = data.legal || {}, loja = L.nome || data.loja || '';
      const usados = Object.keys(ALG_L).filter(k => data.menu.some(m => (m.alerg || []).includes(k)));
      const linha = [L.nome, L.nif ? 'NIF ' + L.nif : '', L.morada, L.contacto].filter(Boolean).map(esc).join(' · ');
      return `<div class="legal">
        ${usados.length ? `<p class="algleg">${usados.map(k => `<i class="algb">${ALG_L[k]}</i> ${T('al_' + k)}`).join(' &nbsp;·&nbsp; ')}</p>` : ''}
        <p>${T('algNote')}</p>
        <p>${data.ivaIsento ? T('vatExempt') : T('vatIncl')}</p>
        ${linha ? `<p>${linha}</p>` : ''}
        <p>${esc(T('privacyTx').replace('{loja}', loja))}</p>
        <p><a href="https://www.livroreclamacoes.pt/Inicio/" target="_blank" rel="noopener">📕 ${T('complaints')}</a> · ${T('disputes')}</p>
      </div>`;
    }
    function total() { return Math.round(cart.reduce((a, c) => a + c.preco * c.qty, 0) * 100) / 100; }
    function barra() {
      const n = cart.reduce((a, c) => a + c.qty, 0);
      document.getElementById('bar').hidden = !n;
      document.getElementById('bar-n').textContent = n;
      document.getElementById('bar-t').textContent = eur(total());
    }
    function aviso(t) { let el = document.getElementById('aviso'); if (!el) { el = document.createElement('div'); el.id = 'aviso'; document.body.appendChild(el); } el.textContent = t; el.className = 'on'; clearTimeout(el._t); el._t = setTimeout(() => el.className = '', 2200); }
    function juntar(m, v) {
      if (m.restam != null && qtdDe(m.id) >= m.restam) return aviso(m.restam ? T('leftN') + ' ' + m.restam : T('soldOut'));
      const ex = cart.find(c => c.id === m.id && c.key === (v ? v.key : ''));
      if (ex) ex.qty++; else cart.push({ id: m.id, key: v ? v.key : '', nome: m.nome + (v ? ' — ' + v.nome : ''), preco: Math.round((m.preco + (v ? v.extra : 0)) * 100) / 100, qty: 1 });
      guardar(); render(); if (navigator.vibrate) try { navigator.vibrate(10); } catch (_) {}
    }
    function tocar(id) {
      const m = data.menu.find(x => x.id === id); if (!m) return;
      if (!m.vars.length) return juntar(m, null);
      let sel = '';
      const desenhar = () => {
        document.getElementById('var-box').innerHTML = `<h3>${esc(m.nome)}</h3><p style="margin:0;color:var(--mut);font-size:13px">${T('choose')}</p>
          <button type="button" class="opt ${sel === '' ? 'on' : ''}" data-k="">${T('normal')} <span>${eur(m.preco)}</span></button>
          ${m.vars.map(v => `<button type="button" class="opt ${sel === v.key ? 'on' : ''}" data-k="${v.key}">${esc(v.nome)} <span>${v.extra ? '+' + eur(v.extra) : eur(m.preco)}</span></button>`).join('')}
          <button type="button" class="main" id="var-ok">${T('add')} · ${eur(m.preco + ((m.vars.find(v => v.key === sel) || {}).extra || 0))}</button>`;
        document.querySelectorAll('#var-box .opt').forEach(b => b.onclick = () => { sel = b.dataset.k; desenhar(); });
        document.getElementById('var-ok').onclick = () => { juntar(m, m.vars.find(v => v.key === sel) || null); fechar('sh-var'); };
      };
      desenhar(); abrir('sh-var');
    }
    function abrir(id) { document.getElementById(id).classList.add('on'); document.body.style.overflow = 'hidden'; }
    function fechar(id) { document.getElementById(id).classList.remove('on'); document.body.style.overflow = ''; }
    // modo tablet (quiosque): não guarda dados do cliente e volta sozinho ao menu
    const K = new URLSearchParams(location.search).get('k') === '1';
    let dados = { nome: '', nif: '', nomeFat: '', email: '', nota: '' };
    if (!K) try { const sv = JSON.parse(localStorage.getItem('ds_cliente') || '{}'); dados.nome = sv.nome || ''; dados.email = sv.email || ''; } catch (_) {}
    let gorj = { pct: 0, cent: 0 };
    const gorjCent = () => gorj.pct === 'x' ? gorj.cent : Math.round(total() * 100 * gorj.pct);
    function lerCampos() {
      const g = id => { const el = document.getElementById(id); return el ? el.value : null; };
      if (g('f-nome') == null) return;
      dados = { nome: g('f-nome').trim(), nif: (g('f-nif') || '').replace(/\D/g, ''), nomeFat: (g('f-nfat') || '').trim(), email: (g('f-email') || '').trim(), nota: (g('f-nota') || '').trim() };
    }
    function abrirCarrinho() { desenharCarrinho(); abrir('sh-cart'); }
    function desenharCarrinho(err) {
      if (!cart.length) { fechar('sh-cart'); render(); return; }
      const tg = 0, tt = total();
      const chip = (v, l) => `<button type="button" class="tipc ${gorj.pct === v ? 'on' : ''}" data-v="${v}">${l}</button>`;
      const online = !!(data && data.online);
      document.getElementById('cart-box').innerHTML = `<h3>${T('yourOrder')}</h3>
        ${cart.map((c, i) => `<div class="row"><span class="nm">${esc(c.nome)}<small>${eur(c.preco)}</small></span><span class="qb"><button type="button" onclick="mudar(${i},-1)">−</button><b>${c.qty}</b><button type="button" class="p" onclick="mudar(${i},1)">+</button></span></div>`).join('')}
        <div class="tot"><span style="font-weight:800;color:var(--mut)">${T('total')}${tg ? ' <small style="font-weight:600">(' + T('withTip') + ' ' + eur(tg / 100) + ')</small>' : ''}</span><b>${eur(tt)}</b></div>
        <label for="f-nome">${T('callName')} *</label><input id="f-nome" value="${esc(dados.nome)}" placeholder="${T('exName')}" autocomplete="${K ? 'off' : 'given-name'}" required>
        <details class="more" id="d-fat" ${dados.nif ? 'open' : ''}><summary>${T('wantInvoice')}</summary>
          <div class="g2"><div><label for="f-nif">${T('nif')}</label><input id="f-nif" inputmode="numeric" maxlength="9" value="${esc(dados.nif)}" placeholder="${T('digits')}" autocomplete="off"></div>
          <div><label for="f-email">${T('email')}</label><input id="f-email" type="email" inputmode="email" value="${esc(dados.email)}" placeholder="nome@gmail.com" autocomplete="${K ? 'off' : 'email'}"></div></div>
          <div id="w-nfat" ${dados.nif ? '' : 'hidden'}><label for="f-nfat">${T('invName')} *</label><input id="f-nfat" value="${esc(dados.nomeFat)}" placeholder="${T('exInv')}" autocomplete="${K ? 'off' : 'name'}"></div>
          <p class="hint">${T('onlyFor')}</p></details>
        <details class="more"><summary>${T('note')}</summary><textarea id="f-nota" rows="2" maxlength="200" placeholder="${T('exNote')}">${esc(dados.nota)}</textarea></details>
        ${K && data.terminal ? `<button type="button" class="main" id="f-term">💳 ${T('payTerminal')} · ${eur(tt)}</button>` : ''}
        ${online ? `<button type="button" class="${K && data.terminal ? 'sec2' : 'main'}" id="f-ok">${K && data.terminal ? '📱 ' + T('payPhone') : T('payNow') + ' · ' + eur(tt)}</button><button type="button" class="sec2" id="f-bal">🧾 ${T('payCounter')}</button>`
                 : `<button type="button" class="${K && data.terminal ? 'sec2' : 'main'}" id="f-bal">${K && data.terminal ? '🧾 ' + T('payCounter') : T('sendCounter') + ' · ' + eur(tt)}</button>`}
        <div class="err" id="f-err">${err ? esc(err) : ''}</div>`;
      const ok = document.getElementById('f-ok'); if (ok) ok.onclick = () => enviar('agora');
      const tm = document.getElementById('f-term'); if (tm) tm.onclick = () => enviar('terminal');
      document.getElementById('f-bal').onclick = () => enviar('balcao');
      document.getElementById('f-nif').oninput = e => { document.getElementById('w-nfat').hidden = !e.target.value.trim(); };
      document.querySelectorAll('#cart-box .tipc').forEach(b => b.onclick = () => {
        lerCampos();
        const v = b.dataset.v;
        if (v === 'x') { const r = prompt(T('tipAsk'), gorj.cent ? (gorj.cent / 100).toFixed(2) : ''); if (r == null) return; const c = Math.round(parseFloat(String(r).replace(',', '.')) * 100); gorj = { pct: c > 0 ? 'x' : 0, cent: Math.max(0, Math.min(c || 0, Math.round(total() * 30))) }; }
        else gorj = { pct: Number(v), cent: 0 };
        desenharCarrinho();
      });
    }
    function mudar(i, d) { lerCampos(); if (d > 0) { const m = data.menu.find(x => x.id === cart[i].id); if (m && m.restam != null && qtdDe(m.id) >= m.restam) return aviso(T('noMore')); } cart[i].qty += d; if (cart[i].qty <= 0) cart.splice(i, 1); guardar(); render(); desenharCarrinho(); }
    async function enviar(modo) {
      lerCampos();
      if (!dados.nome) return desenharCarrinho(T('needName'));
      if (dados.nif && !nifOk(dados.nif)) return desenharCarrinho(T('badNif'));
      if (dados.nif && dados.nomeFat.split(/\s+/).filter(Boolean).length < 2) { const r = desenharCarrinho(T('needInvName')); const d = document.getElementById('d-fat'); if (d) d.open = true; return r; }
      if (dados.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(dados.email)) return desenharCarrinho(T('badEmail2'));
      // só o nome e o email ficam lembrados; o NIF é escolhido em cada pedido (é sempre opcional)
      if (!K) try { localStorage.setItem('ds_cliente', JSON.stringify({ nome: dados.nome, email: dados.email })); } catch (_) {}
      // pede já a autorização de avisos (tem de ser no toque do botão); a subscrição é feita quando o pedido existir
      const perm = K ? null : pedirPermissaoAvisos();
      const b = document.getElementById(modo === 'balcao' ? 'f-bal' : modo === 'terminal' ? 'f-term' : 'f-ok'); b.disabled = true; b.textContent = modo === 'balcao' ? '…' : T('preparingPay');
      try {
        const r = await post(FN, { n: N, acao: 'pedir', pagar: modo === 'balcao' ? 'balcao' : modo === 'terminal' ? 'terminal' : 'agora', gorjeta_cent: 0, itens: cart.map(c => ({ id: c.id, key: c.key, qty: c.qty })), nome: dados.nome, nif: dados.nif, nome_fatura: dados.nomeFat, email: dados.email, nota: dados.nota });
        cart = []; guardar(); gorj = { pct: 0, cent: 0 };
        if (perm && r.a) { const sub = subscreverAvisos(r.a, perm); if (!r.balcao) await Promise.race([sub, new Promise(ok => setTimeout(ok, 4000))]); }
        if (r.balcao) return enviado(r);
        if (r.terminal) return noTerminal(r);
        location.href = 'pagar.html?t=' + r.t + '&n=' + N + (K ? '&k=1' : '');
      } catch (e) {
        // algo esgotou entretanto: atualiza o menu e o carrinho
        try { const nd = await post(FN, { n: N, acao: 'menu' }); data = nd; cart = cart.filter(c => { const m = data.menu.find(x => x.id === c.id); return m && m.restam !== 0; }); guardar(); render(); } catch (_) {}
        desenharCarrinho(e.message);
      }
    }
    // tablet da loja: o valor foi para o terminal SumUp; espera que o cliente encoste o cartão
    let termPoll = null;
    function noTerminal(r) {
      const box = document.getElementById('cart-box');
      box.innerHTML = `<div style="text-align:center;padding:18px 4px 6px">
        <div style="font-size:52px;line-height:1">💳</div>
        <h3 style="font-size:22px;margin:10px 0 4px">${T('tapTerminal')}</h3>
        <p style="margin:0;font-size:44px;font-weight:900;color:var(--brand)">${eur(r.total_cent / 100)}</p>
        <p style="margin:8px 0 0;color:var(--mut);font-size:14px">${T('orderNo')} <b>#${r.numero}</b></p>
        <p id="term-st" style="margin:14px 0 0;font-weight:800;color:var(--brand)">⏳ ${T('waitingPay')}</p>
        <button type="button" class="sec2" id="term-x">${T('cancel')}</button></div>`;
      render();
      let feito = false;
      const fim = () => { clearInterval(termPoll); termPoll = null; };
      document.getElementById('term-x').onclick = async () => { fim(); try { await post(FN, { acao: 'terminal_cancelar', a: r.a }); } catch (_) {} fechar('sh-cart'); };
      const ver = async () => {
        if (feito) return;
        try {
          const v = await post(FN, { acao: 'terminal_ver', a: r.a });
          if (v.pago) { feito = true; fim(); return enviado(Object.assign({}, r, { pago: true })); }
          if (v.estado === 'failed' || v.estado === 'cancelled') {
            fim(); const st = document.getElementById('term-st');
            if (st) st.innerHTML = `<span style="color:#b91c1c">${T('payFailed')}</span>`;
            const x = document.getElementById('term-x'); if (x) { x.textContent = T('back'); }
          }
        } catch (_) {}
      };
      termPoll = setInterval(ver, 2000);
      setTimeout(() => { if (!feito && termPoll) { fim(); post(FN, { acao: 'terminal_cancelar', a: r.a }).catch(() => {}); fechar('sh-cart'); } }, 3 * 60 * 1000);
    }
    function enviado(r) {
      document.getElementById('cart-box').innerHTML = `<div style="text-align:center;padding:18px 4px 6px">
        <div style="font-size:46px">✅</div><h3 style="font-size:22px">${T('sentTitle')}</h3>
        <p style="margin:6px 0 0;color:var(--mut);font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.08em">${T('orderNo')}</p>
        <p style="margin:0;font-size:56px;font-weight:900;color:var(--brand);line-height:1.1">#${r.numero}</p>
        ${r.pago ? `<p style="margin:12px 0 0;font-size:16px;font-weight:800;color:#15803d">✓ ${T('paidOk')} · ${eur(r.total_cent / 100)}</p>` : `<p style="margin:12px 0 0;font-size:15px">${T('payAt')} <b style="font-size:20px">${eur(r.total_cent / 100)}</b></p>`}
        <p style="margin:6px 0 0;color:var(--mut);font-size:13px">${T('weCall')}</p>
        <div id="acp"></div>
        <button type="button" class="main" id="f-novo">${K ? T('back') : T('newOrder')}</button></div>`;
      render();
      if (r.a) { if (K) acompanharQR(document.getElementById('acp'), r.a); else acompanhar(document.getElementById('acp'), r.a); }
      const voltar = () => { fechar('sh-cart'); if (K) { dados = { nome: '', nif: '', nomeFat: '', email: '', nota: '' }; scrollTo(0, 0); try { if (sessionStorage.getItem('ds_lang_cli')) { sessionStorage.removeItem('ds_lang_cli'); location.reload(); } } catch (_) {} } };
      document.getElementById('f-novo').onclick = voltar;
      if (K) setTimeout(() => { if (document.getElementById('f-novo')) voltar(); }, 30000);
    }
    // pagamento do balcão à espera (cliente encostou o telemóvel na etiqueta do balcão)
    async function vigiarBalcao() {
      try {
        const r = await post(FN_PAG, { n: N });
        const bn = document.getElementById('banner');
        if (r.t) { bn.classList.add('on'); document.getElementById('banner-t').textContent = T('counterWaiting') + (r.valor_cent ? ': ' + eur(r.valor_cent / 100) : '');
          document.getElementById('banner-b').onclick = () => location.href = 'pagar.html?t=' + r.t; }
        else bn.classList.remove('on');
      } catch (_) {}
      setTimeout(vigiarBalcao, 4000);
    }
    document.getElementById('tagl').textContent = T('tagline');
    document.getElementById('banner-b').textContent = T('payBtn');
    document.getElementById('bar-l').textContent = T('seeCart');
    document.getElementById('list').innerHTML = '<div class="empty">' + T('menuLoading') + '</div>';
    langSeletor(document.getElementById('langs'));
    (async () => {
      if (!/^[a-f0-9]{24}$/.test(N)) { document.getElementById('list').innerHTML = '<div class="empty">' + T('linkBad') + '</div>'; return; }
      try { data = await post(FN, { n: N, acao: 'menu' }); } catch (e) { document.getElementById('list').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
      marca();
      // tira do carrinho o que já não existe
      cart = cart.filter(c => data.menu.some(m => m.id === c.id)); guardar();
      render(); if (!K) vigiarBalcao();
      // atualiza o menu de vez em quando (artigos que esgotam / voltam)
      setInterval(async () => { if (document.querySelector('.sheet.on') || document.hidden) return; try { data = await post(FN, { n: N, acao: 'menu' }); render(); } catch (_) {} }, 45000);
    })();
  </script>
</body>
