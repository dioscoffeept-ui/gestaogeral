name: Páginas dos cartões de fidelidade
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/cartoes.mjs', 'scripts/verificar-og.mjs', '.github/workflows/cartoes.yml', '*.html', 'c/**', 'conhecer/**', 'diostock-og.png', 'cartao-og.png', 'convite-og.png', 'gestor/**', 'PRE-VISUALIZACAO.md']
permissions:
  contents: write
concurrency:
  group: cartoes
  cancel-in-progress: false
jobs:
  paginas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i --no-save --no-package-lock @resvg/resvg-js@2.6.2 sharp@0.33.5
      - run: node scripts/cartoes.mjs
      # REGRA FIXA: nenhuma página é publicada se a pré-visualização não for o banner grande 1200×630
      - run: node scripts/verificar-og.mjs
      - name: Guardar
        run: |
          if [ -n "$(git status --porcelain n m k)" ]; then
            git config user.name "Dio'Stock"
            git config user.email "diostockpt@users.noreply.github.com"
            git add n m k
            git commit -m "Cartões: páginas de pré-visualização"
            git pull --rebase -q
            git push
          fi
