name: Páginas dos cartões de fidelidade
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cartoes
  cancel-in-progress: false
jobs:
  paginas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i --no-save --no-package-lock @resvg/resvg-js@2.6.2
      - run: node scripts/cartoes.mjs
      - name: Guardar
        run: |
          if [ -n "$(git status --porcelain n m)" ]; then
            git config user.name "Dio'Stock"
            git config user.email "diostockpt@users.noreply.github.com"
            git add n m
            git commit -m "Cartões: páginas de pré-visualização"
            git pull --rebase -q
            git push
          fi
