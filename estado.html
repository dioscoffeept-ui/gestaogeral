<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pedido</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --brand: #9C3815; --ink: #0f172a; --mut: #64748b; --bg: #F6F3F0; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .w { max-width: 460px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 16px 30px; text-align: center; }
  .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .shop { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 16px; text-align: left; }
  .logo { width: 38px; height: 38px; border-radius: 12px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; overflow: hidden; }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .lbl { margin: 26px 0 0; font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); }
  .num { margin: 2px 0 0; font-size: 64px; font-weight: 900; line-height: 1.05; color: var(--brand); }
  .nm { font-size: 15px; font-weight: 700; color: #334155; }
  ul { list-style: none; padding: 12px 14px; margin: 16px 0 0; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; text-align: left; font-size: 14px; }
  li { padding: 3px 0; } li b { margin-right: 6px; }
  .err { padding: 60px 10px; color: var(--mut); font-weight: 700; }
</style>
</head>
<body>
  <div class="w">
    <div class="hd"><div class="shop"><div class="logo" id="logo">☕</div><span id="loja"></span></div><div id="langs"></div></div>
    <div id="app"><p class="err" id="ld"></p></div>
  </div>
  <script src="cli-i18n.js"></script>
  <script src="acompanhar.js"></script>
  <script>
    // "Adicionar ao ecrã principal" abre este pedido (não o app da loja)
    try { const mf = { name: 'Pedido', short_name: 'Pedido', start_url: location.href, scope: new URL('./', location.href).href, display: 'standalone', background_color: '#F6F3F0', theme_color: '#9C3815', icons: [{ src: new URL('icon-192.png', location.href).href, sizes: '192x192', type: 'image/png' }, { src: new URL('icon-512.png', location.href).href, sizes: '512x512', type: 'image/png' }] }; const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(mf)); document.head.appendChild(l); } catch (_) {}
    const A = new URLSearchParams(location.search).get('a') || '';
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    document.getElementById('ld').textContent = T('loading');
    langSeletor(document.getElementById('langs'));
    document.title = T('trackT');
    (async () => {
      if (!/^[a-f0-9]{32}$/.test(A)) { document.getElementById('app').innerHTML = `<p class="err">${T('linkBad')}</p>`; return; }
      let r;
      try { const x = await fetch('https://brisrzuvvxkkzhmhsgro.supabase.co/functions/v1/pedido-publico', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ acao: 'estado', a: A }) }); r = await x.json(); if (!x.ok) throw new Error(r.erro || 'Erro'); }
      catch (e) { document.getElementById('app').innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
      const m = r.marca || {};
      if (m.brand) document.documentElement.style.setProperty('--brand', m.brand);
      if (m.bg) document.documentElement.style.setProperty('--bg', m.bg);
      if (m.logo) document.getElementById('logo').innerHTML = `<img src="${esc(m.logo)}" alt="">`;
      document.getElementById('loja').textContent = r.loja || '';
      document.getElementById('app').innerHTML = `<p class="lbl">${T('order')}</p><p class="num">#${esc(r.numero)}</p>${r.nome ? `<p class="nm">${esc(r.nome)}</p>` : ''}<div id="acp"></div>
        <ul>${(r.itens || []).map(i => `<li><b>${esc(i.qty)}×</b>${esc(i.nome)}</li>`).join('')}</ul>`;
      acompanhar(document.getElementById('acp'), A);
    })();
  </script>
</body>
</html>
