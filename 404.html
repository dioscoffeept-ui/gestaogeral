<script>
  // Páginas de cartões (n/<código>/) e mensagens (m/<código>/) acabadas de criar ainda podem não existir no site
  // (são geradas de hora a hora). Em vez de "página não encontrada", o cliente vai logo para o cartão certo.
  (function () {
    var p = location.pathname, q = location.search || '';
    var n = p.match(/\/n\/([A-Za-z0-9]{6})\/?/), c = p.match(/\/c\/([A-Za-z0-9]{7})\/?/);
    var base = p.replace(/\/(n|c|m)\/[^/]*\/?.*$/, '/');
    if (n) { location.replace(base + 'cartao.html?n=' + n[1]); return; }
    if (c) { location.replace(base + 'cartao.html?k=' + c[1]); return; }
        window.__nada = true;
  })();
</script>
