<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagamento · Dio´Stock</title>
<style>
  :root { --brand: #9a3412; --ink: #0f172a; --bg: #F6F3F0; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; padding: 24px 16px; }
  .card { background: #fff; border-radius: 24px; padding: 36px 28px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 20px 50px -30px rgba(15,23,42,.4); }
  .ic { width: 72px; height: 72px; border-radius: 999px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; background: var(--brand); color: #fff; font-size: 36px; font-weight: 900; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { margin: 0; color: #64748b; font-size: 15px; line-height: 1.5; }
  small { display: block; margin-top: 22px; color: #94a3b8; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="ic" id="ic">✓</div>
    <h1 id="t">Pagamento concluído</h1>
    <p id="d">Obrigado! Pode mostrar este ecrã no balcão.</p>
    <small>Pagamento processado pela Stripe · Dio´Stock</small>
  </div>
  <script>
    if (/cancelado=1/.test(location.search)) {
      document.getElementById('ic').textContent = '✕';
      document.getElementById('t').textContent = 'Pagamento cancelado';
      document.getElementById('d').textContent = 'Nada foi cobrado. Fale com o balcão se quiser tentar de novo.';
    }
  </script>
</body>
</html>
