<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pagamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --brand: #9C3815; --brand-soft: #fbeee8; --ink: #0f172a; --mut: #64748b; --line: #e2e8f0; --bg: #F6F3F0; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 440px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 16px 28px; }
  .shop { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 14px; }
  .logo { width: 38px; height: 38px; border-radius: 12px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 17px; overflow: hidden; }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .shop b { font-size: 16px; font-weight: 900; }
  .tag { font-size: 10px; font-weight: 900; padding: 3px 8px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); }
  .card { background: #fff; border: 1px solid #f1f5f9; border-radius: 24px; padding: 20px 18px; box-shadow: 0 16px 36px -28px rgba(15,23,42,.5); }
  .amt { text-align: center; font-size: 44px; font-weight: 900; letter-spacing: -.03em; line-height: 1.05; }
  .what { text-align: center; font-size: 13px; color: var(--mut); margin: 6px 0 0; line-height: 1.4; }
  .what summary { cursor: pointer; list-style: none; font-weight: 600; } .what summary::-webkit-details-marker { display: none; }
  .what ul { list-style: none; padding: 0; margin: 8px 0 0; text-align: left; border-top: 1px solid #f1f5f9; }
  .what li { display: flex; gap: 8px; padding: 6px 2px; border-bottom: 1px solid #f8fafc; color: var(--ink); font-weight: 600; font-size: 13px; }
  .what li i { font-style: normal; color: var(--brand); font-weight: 900; min-width: 22px; }
  .sep { height: 1px; background: #f1f5f9; margin: 18px -18px; }
  .em { margin-top: 14px; }
  .em summary { font-size: 13px; font-weight: 700; color: var(--brand); cursor: pointer; list-style: none; } .em summary::-webkit-details-marker { display: none; }
  .em input { width: 100%; margin-top: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 16px; font-family: inherit; outline: none; }
  .em input:focus { border-color: var(--brand); }
  .hint { font-size: 11px; color: #94a3b8; margin-top: 5px; }
  button.pay { width: 100%; margin-top: 16px; padding: 16px; border: 0; border-radius: 14px; background: var(--brand); color: #fff; font-size: 17px; font-weight: 900; font-family: inherit; cursor: pointer; box-shadow: 0 12px 26px -14px var(--brand); }
  button.pay:disabled { opacity: .5; }
  button.sec { width: 100%; margin-top: 10px; padding: 13px; border-radius: 12px; border: 2px solid var(--brand); background: #fff; color: var(--brand); font-weight: 900; font-size: 14px; font-family: inherit; }
  .err { color: #b91c1c; font-size: 13px; margin-top: 10px; font-weight: 600; text-align: center; }
  .ok { text-align: center; }
  .ok .ic { width: 76px; height: 76px; border-radius: 999px; margin: 4px auto 14px; display: flex; align-items: center; justify-content: center; background: var(--brand); color: #fff; font-size: 38px; font-weight: 900; }
  .ok h1 { font-size: 22px; font-weight: 900; margin: 0 0 6px; } .ok p { color: var(--mut); font-size: 14px; margin: 0; line-height: 1.5; }
  .wait .dot { width: 54px; height: 54px; border-radius: 999px; border: 5px solid var(--brand-soft); border-top-color: var(--brand); margin: 6px auto 14px; animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  .foot { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 14px; }
  .spin { text-align: center; color: var(--mut); padding: 30px 0; font-size: 14px; font-weight: 600; }
  input[type=email]::placeholder { color: #94a3b8; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="shop"><div class="logo" id="logo">€</div><b id="lname">Pagamento</b><span class="tag" id="ltag" hidden>TESTE</span></div>
    <div class="card" id="app"><div class="spin">A carregar…</div></div>
    <p class="foot">🔒 Pagamento seguro · Stripe</p>
  </div>
  <script src="https://js.stripe.com/v3/"></script>
  <script>
    const FN = 'https://brisrzuvvxkkzhmhsgro.supabase.co/functions/v1/pagar-publico';
    let T = new URLSearchParams(location.search).get('t') || '';
    const N = new URLSearchParams(location.search).get('n') || '';
    const app = document.getElementById('app');
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const eur = c => (c / 100).toLocaleString('pt-PT', { style: 'currency', currency: 'EUR' });
    const emailOk = v => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
    let info = null, stripe = null, elements = null, poll = null;
    async function call(acao, extra) {
      const r = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ t: T, acao }, extra || {})) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.erro || 'Erro ' + r.status);
      return j;
    }
    function marca() {
      const l = info.loja || 'Pagamento', m = info.marca || {};
      if (m.brand) { document.documentElement.style.setProperty('--brand', m.brand); document.documentElement.style.setProperty('--brand-soft', 'color-mix(in srgb, ' + m.brand + ' 12%, #fff)'); }
      if (m.bg) document.documentElement.style.setProperty('--bg', m.bg);
      document.getElementById('lname').textContent = l;
      document.getElementById('ltag').hidden = !info.teste;
      const lg = document.getElementById('logo');
      if (m.logo) lg.innerHTML = '<img src="' + esc(m.logo) + '" alt="">'; else lg.textContent = (l.trim()[0] || '€').toUpperCase();
      document.title = 'Pagamento · ' + l;
    }
    function itens() {
      const parts = String(info.descricao || '').split(/,\s*/).filter(Boolean);
      const n = parts.reduce((a, p) => a + (Number((p.match(/^(\d+)×/) || [])[1]) || 1), 0);
      return `<details class="what"><summary>${n} artigo${n === 1 ? '' : 's'} · ver pedido ▾</summary><ul>${parts.map(p => { const m = p.match(/^(\d+)×\s*(.*)$/); return m ? `<li><i>${esc(m[1])}×</i><span>${esc(m[2])}</span></li>` : `<li><span>${esc(p)}</span></li>`; }).join('')}</ul></details>`;
    }
    function okScreen(emailJa) {
      clearInterval(poll);
      const pd = info.pedido;
      app.innerHTML = (pd ? `<div class="ok"><div class="ic">✓</div><p style="font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase">Pedido</p><h1 style="font-size:54px;line-height:1;margin:2px 0 8px">#${esc(pd.numero)}</h1><p>Pago · <b style="color:var(--ink)">${eur(info.valor_cent)}</b></p><p style="margin-top:6px">Já estamos a preparar. Chamamos pelo número quando estiver pronto.</p></div>`
        : `<div class="ok"><div class="ic">✓</div><h1>Pago!</h1><p><b style="color:var(--ink);font-size:18px">${eur(info.valor_cent)}</b></p><p style="margin-top:6px">Obrigado. Pode mostrar este ecrã no balcão.</p></div>`) + `${itens()}
        <div class="sep"></div><div id="rec">${emailJa ? `<p class="hint" style="text-align:center;font-size:13px">✓ Comprovativo enviado para <b>${esc(emailJa)}</b></p>` : `
          <p style="font-size:14px;font-weight:800;margin:0 0 8px;text-align:center">Quer o comprovativo por email?</p>
          <div class="em" style="margin-top:0"><input type="email" id="em2" placeholder="nome@gmail.com" autocomplete="email" inputmode="email"></div>
          <button class="sec" id="send">Enviar comprovativo</button><div class="err" id="err2"></div>`}</div>`;
      const b = document.getElementById('send');
      if (b) b.onclick = async () => {
        const v = document.getElementById('em2').value.trim(), e = document.getElementById('err2');
        if (!emailOk(v)) { e.textContent = 'Escreva um email válido.'; return; }
        b.disabled = true; b.textContent = 'A enviar…';
        try { await call('recibo', { email: v }); document.getElementById('rec').innerHTML = `<p class="hint" style="text-align:center;font-size:13px">✓ Comprovativo enviado para <b>${esc(v)}</b></p>`; }
        catch (x) { e.textContent = x.message; b.disabled = false; b.textContent = 'Enviar comprovativo'; }
      };
    }
    function waitScreen(msg) {
      app.innerHTML = `<div class="ok wait"><div class="dot"></div><h1 style="font-size:19px">${esc(msg || 'A confirmar o pagamento…')}</h1><p>${eur(info.valor_cent)} · não feche esta página.</p></div>`;
      clearInterval(poll);
      let n = 0;
      poll = setInterval(async () => {
        n++;
        try { const r = await call('info'); if (r.estado === 'pago') { info = Object.assign(info, r); return okScreen(r.email); }
          if (r.estado === 'expirado' || (r.estado === 'aberto' && r.status === 'requires_payment_method' && n > 1 && r.client_secret)) { clearInterval(poll); info = Object.assign(info, r); return payScreen(r.estado === 'expirado' ? null : 'O pagamento não foi aceite. Tente de novo ou escolha outro método.'); }
        } catch (_) {}
        if (n > 100) clearInterval(poll);
      }, 3000);
    }
    function payScreen(erroMsg) {
      if (info.estado !== 'aberto' || !info.client_secret) { app.innerHTML = '<div class="spin">Este pagamento já não está ativo.<br>Peça um novo no balcão.</div>'; return; }
      if (!window.Stripe || !info.pk) { app.innerHTML = '<div class="spin">Não foi possível carregar o pagamento. Atualize a página.</div>'; return; }
      app.innerHTML = `<div class="amt">${eur(info.valor_cent)}</div>${itens()}<div class="sep"></div>
        <div id="pe"></div>
        <details class="em"><summary>✉️ Receber comprovativo por email (opcional)</summary><input type="email" id="em" placeholder="nome@gmail.com" autocomplete="email" inputmode="email"></details>
        <button class="pay" id="pay" disabled>Pagar ${eur(info.valor_cent)}</button><div class="err" id="err">${erroMsg ? esc(erroMsg) : ''}</div>`;
      const brand = (info.marca && info.marca.brand) || '#9C3815';
      stripe = stripe || Stripe(info.pk, { stripeAccount: info.conta, locale: 'pt' });
      elements = stripe.elements({ clientSecret: info.client_secret, fonts: [{ cssSrc: 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap' }],
        appearance: { theme: 'stripe', variables: { colorPrimary: brand, colorText: '#0f172a', borderRadius: '12px', fontFamily: 'Inter, -apple-system, Segoe UI, Roboto, sans-serif', spacingUnit: '4px' },
          rules: { '.AccordionItem': { boxShadow: 'none', borderColor: '#e2e8f0' } } } });
      const pe = elements.create('payment', {
        layout: { type: 'accordion', defaultCollapsed: false, radios: true, spacedAccordionItems: true },
        paymentMethodOrder: ['apple_pay', 'google_pay', 'mb_way', 'card'],
        wallets: { applePay: 'auto', googlePay: 'auto' },
      });
      pe.mount('#pe');
      const btn = document.getElementById('pay'), err = document.getElementById('err');
      pe.on('ready', () => { btn.disabled = false; });
      pe.on('loaderror', ev => { err.textContent = (ev && ev.error && ev.error.message) || 'Erro ao carregar os métodos de pagamento.'; });
      btn.onclick = async () => {
        err.textContent = '';
        const email = ((document.getElementById('em') || {}).value || '').trim();
        if (email && !emailOk(email)) { err.textContent = 'O email não parece correto (ou deixe em branco).'; return; }
        btn.disabled = true; btn.textContent = 'A processar…';
        const params = { return_url: location.origin + location.pathname + '?t=' + T };
        if (email) params.receipt_email = email;
        const { error, paymentIntent } = await stripe.confirmPayment({ elements, confirmParams: params, redirect: 'if_required' });
        if (error) { err.textContent = traduz(error); btn.disabled = false; btn.textContent = 'Pagar ' + eur(info.valor_cent); return; }
        if (paymentIntent && paymentIntent.status === 'succeeded') return okScreen(email);
        // MB WAY e outros: o cliente confirma na app — esperamos aqui
        waitScreen(paymentIntent && paymentIntent.payment_method_types && paymentIntent.payment_method_types.includes('mb_way') ? 'Confirme o pagamento na app MB WAY' : 'A confirmar o pagamento…');
      };
    }
    function traduz(e) {
      const c = (e && (e.decline_code || e.code)) || '';
      const m = { card_declined: 'O cartão foi recusado.', insufficient_funds: 'Saldo insuficiente.', expired_card: 'O cartão está expirado.', incorrect_cvc: 'O código de segurança (CVC) está errado.', processing_error: 'Erro ao processar. Tente de novo.', incorrect_number: 'O número do cartão está errado.' };
      return m[c] || (e && e.message) || 'O pagamento não foi concluído.';
    }
    // etiqueta NFC da loja: espera que o balcão envie o valor e abre esse pagamento
    async function nfcStart() {
      let n = 0;
      const tick = async () => {
        n++;
        let r = null;
        try { const x = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ n: N }) }); r = await x.json(); if (!x.ok) throw new Error(r.erro || 'Erro'); }
        catch (e) { app.innerHTML = `<div class="spin">Este link NFC não está completo.<br><span style="font-weight:500;font-size:12px">No Dio´Stock: Balcão → Pagamentos → Etiqueta NFC da loja → Copiar, e grave esse link na etiqueta.</span></div>`; return; }
        if (!info) { info = { loja: r.loja, marca: r.marca, teste: false }; marca(); }
        if (r.t) { T = r.t; history.replaceState(null, '', location.pathname + '?t=' + T); info = null; return start(); }
        return location.replace('pedir.html?n=' + N);
        app.innerHTML = `<div class="ok wait"><div class="dot"></div><h1 style="font-size:19px">À espera do valor…</h1><p>Peça no balcão para enviar o pagamento.<br>Esta página abre sozinha.</p></div>`;
        if (n < 200) setTimeout(tick, 2000);
      };
      tick();
    }
    async function start() {
      if (!T && N) return nfcStart();
      if (!T) { app.innerHTML = '<div class="spin">Link de pagamento inválido.</div>'; return; }
      try { info = await call('info'); } catch (x) { app.innerHTML = `<div class="spin">${esc(x.message)}</div>`; return; }
      marca();
      const rs = new URLSearchParams(location.search).get('redirect_status');
      if (info.estado === 'pago') return okScreen(info.email);
      if (rs === 'succeeded' || info.estado === 'a_processar') return waitScreen();
      if (rs === 'failed') return payScreen('O pagamento não foi aceite. Tente de novo ou escolha outro método.');
      payScreen();
    }
    start();
  </script>
</body>
</html>
